services:
  db:
    image: postgres:16-alpine
    container_name: meteora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meteora
    ports:
      # Host 5433 -> container 5432 (evita conflito com Postgres nativo na 5432)
      - "5433:5432"
    volumes:
      - meteora_pgdata:/var/lib/postgresql/data
      # Cria as tabelas automaticamente na primeira vez que o banco sobe
      - ./scripts/create-tables-camelcase.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meteora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meteora_pgdata:
